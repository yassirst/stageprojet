<div class="search-filters">
  <div class="filter-item">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" class="filter-icon">
      <path d="M4 6h16M4 12h10M4 18h6" />
    </svg>
    <select [value]="topic" (change)="topic = $any($event.target).value; emitChange()">
      <option value="">المحاور</option>
      @for (t of topicOptions(); track t) {
        <option [value]="t">{{ t }}</option>
      }
    </select>
  </div>

  <div class="divider"></div>

  <div class="filter-item">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="filter-icon">
      <path d="M7 10l5 5 5-5z" />
    </svg>
    <select [value]="program" (change)="program = $any($event.target).value; emitChange()">
      <option value="">البرنامج</option>
      @for (name of programOptions(); track name) {
        <option [value]="name">{{ name }}</option>
      }
    </select>
  </div>

  <div class="divider"></div>

  <div class="search-box">
    <input
      type="text"
      placeholder="ابحث عن برنامج..."
      [value]="search"
      (input)="search = $any($event.target).value; emitChange()" />
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="search-icon">
      <path
        d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14" />
    </svg>
  </div>
</div>
